<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#243341">
    <meta
      name="description"
      content="Arte 3D de Jose Manuel Pastor González. Explora mis modelos con texturas y wireframe."
    >
    <title>
      Arte 3D — Jose Manuel Pastor González
    </title>
    <link rel="icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css?v=3d-21">
    <script src="content.js?v=3d-21" defer>
    </script>
    <link rel="stylesheet" href="viewer3d.css?v=3d-21">
    <script type="importmap">
      {"imports":{"three":"./assets/vendor/three/build/three.module.js"}}
    </script>
    <script type="module" src="viewer3d.js?v=3d-21"></script>
    <script src="script.js?v=3d-21" defer>
    </script>
  </head>
  <body data-page="art3d">
    <a class="skip" href="#main" data-t="skip">
      Saltar al contenido
    </a>
    <!-- Navegación e idioma -->
    <header>
      <a class="brand" href="index.html" aria-label="José Manuel — Inicio">
        <img src="assets/logo.png" alt="" width="40" height="40">
        JM
      </a>
      <nav aria-label="Principal">
        <a href="index.html#work" data-t="work">
          Proyectos
        </a>
        <a href="jams.html" data-t="jams">
          Game jams
        </a>
        <a href="art.html" aria-current="page" data-t="art">
          Arte
        </a>
        <a href="index.html#sound" data-t="sound">
          Música
        </a>
        <a href="index.html#about" data-t="about">
          Sobre mí
        </a>
      </nav>
      <label class="language">
        <span class="sr-only" data-t="language">
          Idioma
        </span>
        <select id="language">
          <option value="es">
            ES · Español
          </option>
          <option value="en">
            EN · English
          </option>
        </select>
      </label>
      <button class="menu-toggle" type="button" aria-controls="mobile-menu"
        aria-expanded="false" aria-haspopup="dialog" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </header>
    <!-- El diálogo bloquea la interacción con el fondo mientras está abierto. -->
    <dialog id="mobile-menu" class="mobile-menu" aria-labelledby="mobile-menu-title">
      <div class="mobile-menu-top">
        <h2 id="mobile-menu-title" data-t="menuTitle">Navegación</h2>
        <button class="menu-close" type="button" aria-label="Cerrar menú">×</button>
      </div>
      <nav class="mobile-menu-links" aria-label="Navegación móvil"></nav>
      <p class="mobile-menu-note">JM / PORTFOLIO</p>
    </dialog>
    <main id="main">
      <section class="model-intro" aria-label="Arte 3D">
        <nav class="art-tabs" aria-label="Arte / Art">
          <a href="art.html" data-t="gallery2D">Arte 2D</a>
          <a href="arte3d.html" aria-current="page" data-t="gallery3D">Arte 3D</a>
        </nav>
        <p data-t="modelShortIntro">Personajes, objetos e ideas en tres dimensiones.</p>
      </section>
      <section class="model-section" aria-labelledby="model-name">
        <div class="model-workbench">
          <div class="model-heading-row">
            <div>
              <p class="eyebrow" id="model-counter"></p>
              <h2 id="model-name">Robot</h2>
            </div>
            <p class="model-meta" id="model-meta"></p>
          </div>
          <div class="model-toolbar" role="group" aria-label="Visualización / Display">
            <button type="button" data-mode="textured" aria-pressed="true" data-t="modelTextured">Texturizado</button>
            <button type="button" data-mode="wire" aria-pressed="false">Wireframe</button>
            <button type="button" data-mode="overlay" aria-pressed="false" data-t="modelOverlay">Textura + wireframe</button>
          </div>
          <div id="model-stage" class="model-stage" aria-busy="true">
            <img id="model-poster" src="assets/models/robot/cover.webp?v=3d-21" alt="Robot" width="600" height="600">
            <canvas id="model-canvas" tabindex="0" aria-label="Visor 3D interactivo"></canvas>
            <div id="model-status" role="status" aria-live="polite"></div>
          </div>
          <div class="model-controls">
            <button type="button" id="model-rotation" aria-pressed="true" data-t="modelRotation">Giro automático</button>
            <div class="model-camera-controls">
              <button type="button" id="model-left" aria-label="Girar a la izquierda">←</button>
              <button type="button" id="model-right" aria-label="Girar a la derecha">→</button>
              <button type="button" id="model-zoom-out" aria-label="Alejar">−</button>
              <button type="button" id="model-zoom-in" aria-label="Acercar">+</button>
              <button type="button" id="model-reset" data-t="modelReset">Restablecer vista</button>
            </div>
          </div>
        </div>
        <div class="model-project-filter">
          <label for="model-project" data-t="modelProject">Proyecto</label>
          <select id="model-project">
            <option value="all" data-t="modelAllProjects">Todos los proyectos</option>
            <option value="time-bender">Time Bender · Game jam</option>
            <option value="nordico" data-t="modelNordic">Nórdico</option>
          </select>
          <button type="button" id="gallery-prev" aria-label="Modelos anteriores / Previous models">←</button>
          <button type="button" id="gallery-next" aria-label="Más modelos / More models">→</button>
        </div>
        <div id="model-gallery" class="model-gallery" aria-label="Modelos / Models"></div>
        <noscript><p>Activa JavaScript para utilizar el visor 3D. / Enable JavaScript to use the 3D viewer.</p></noscript>
      </section>
      <footer class="model-footer">© 2026 Jose Manuel Pastor González <span data-t="modelHint">Arrastra para girar · Pellizca o usa la rueda para acercar</span></footer>
    </main>
  </body>
</html>
